; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32doit-devkit-v1]
platform = espressif32 @ 8.0.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
; 1.9 MB app partitions (default is 1.25 MB, too small once TLS is linked in); SPIFFS is not used
board_build.partitions = min_spiffs.csv

; WPA2 password of the "ToF-Setup" configuration access point (8-63 characters).
; Taken from the environment so it never ends up in the repository:
;   export KOORNIK_AP_PASSWORD='choose-a-strong-password'
build_flags =
    '-D AP_PASSWORD="${sysenv.KOORNIK_AP_PASSWORD}"'

lib_deps = 
    adafruit/Adafruit_VL53L0X@^1.2.4
    bblanchon/ArduinoJson@^7.2.1
    knolleary/PubSubClient@^2.8
    ; Maintained forks; the original me-no-dev libraries crash on Arduino core 3.x (lwIP core lock assert)
    esp32async/AsyncTCP@^3.4.0
    esp32async/ESPAsyncWebServer@^3.7.0
