services:
  db:
    image: postgres:18.1
    restart: unless-stopped
    shm_size: 128mb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: KoornikDB
      POSTGRES_USER: koornik_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - db_data:/var/lib/postgresql
    secrets:
      - db_password

  koornik.api:
    image: koornik.api
    build:
      context: .
      dockerfile: Koornik.API/Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      - db
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__KoornikDB: "Host=db;Port=5432;Database=KoornikDB;Username=koornik_user;Password=f!^pIu!3#E&Qag"

volumes:
  db_data:

secrets:
  db_password:
    file: ./secrets/db_password.txt

services:
  koornik.web:
    image: koornik.web
    build:
      context: .
      dockerfile: BlazorApp1/BlazorApp1.Client/Dockerfile

  blazorapp1:
    image: blazorapp1
    build:
      context: .
      dockerfile: BlazorApp1/BlazorApp1/Dockerfile

