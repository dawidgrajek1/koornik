services:
  db:
    image: postgres:18.1
    restart: unless-stopped
    shm_size: 128mb
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql
    env_file:
      - path: .env
        required: true
      - path: .env.secrets
        required: true

  koornik.api:
    image: koornik.api
    build:
      context: .
      dockerfile: Koornik.API/Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      - db
    env_file:
      - path: .env
        required: true
      - path: .env.secrets
        required: true

volumes:
  db_data:
