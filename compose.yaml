services:
  db:
    image: postgres:18.1
    restart: unless-stopped
    shm_size: 128mb
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql
    env_file:
      - path: .env
        required: true
      - path: .env.secrets
        required: true

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: unless-stopped
    depends_on:
      - db

  koornik.api:
    image: koornik.api
    build:
      context: .
      dockerfile: Koornik.API/Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      - db
      - mosquitto
    env_file:
      - path: .env
        required: true
      - path: .env.secrets
        required: true

volumes:
  db_data:
